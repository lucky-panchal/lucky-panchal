name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow numpy opencv-python-headless rembg onnxruntime

      - name: Generate ASCII portrait
        run: python3 scripts/make_portrait.py

      - name: Generate stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          FILES="ascii.svg stats.svg streak.svg langs.svg year.svg hd-about.svg hd-stack.svg hd-projects.svg hd-stats.svg hd-connect.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh $(date -u +%Y-%m-%d)"
          git push
